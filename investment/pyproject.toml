[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-decision-swing"
version = "0.2.0"
description = "Evidence-based Japanese equity multi-horizon decision support"
requires-python = ">=3.13"
dependencies = ["streamlit>=1.50,<2", "pandas>=2.2,<4", "numpy>=2,<3", "requests>=2.32,<3", "pillow>=10,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
